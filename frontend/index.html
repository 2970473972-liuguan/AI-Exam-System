<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 智能题库</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <section id="view-auth" class="view is-active">
    <div class="auth-wrap">
      <div class="auth-card">
        <div class="auth-brand"><i data-lucide="graduation-cap"></i><h1>AI 智能题库</h1></div>
        <div class="auth-tabs">
          <button class="auth-tab is-active" data-tab="login">登录</button>
          <button class="auth-tab" data-tab="register">注册</button>
        </div>
        <form id="authForm">
          <label>用户名<input id="authUsername" type="text" autocomplete="username" required /></label>
          <label>密码<input id="authPassword" type="password" autocomplete="current-password" required /></label>
          <button class="btn btn-primary btn-block" type="submit" id="authSubmit">登录</button>
        </form>
        <p class="auth-hint" id="authHint"></p>
      </div>
    </div>
  </section>

  <div id="view-app" class="view">
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="#" id="brandHome"><i data-lucide="graduation-cap"></i><strong>AI 智能题库</strong></a>
        <nav class="topnav">
          <button class="nav-btn is-active" data-nav="home"><i data-lucide="layout-grid"></i><span>首页</span></button>
          <button class="nav-btn" data-nav="wrong"><i data-lucide="book-marked"></i><span>错题</span><span class="badge" id="wrongBadge"></span></button>
          <button class="nav-btn" data-nav="admin"><i data-lucide="refresh-cw"></i><span>刷新</span></button>
          <button class="icon-btn" id="logout" title="退出登录"><i data-lucide="log-out"></i></button>
        </nav>
      </div>
    </header>

    <main class="shell">
      <section id="panel-home" class="panel is-active"></section>
      <section id="panel-practice" class="panel"></section>
      <section id="panel-result" class="panel"></section>
      <section id="panel-wrong" class="panel"></section>
      <section id="panel-admin" class="panel"></section>
    </main>
  </div>

  <div class="toast" id="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
